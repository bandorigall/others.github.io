function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function cp(text) { return '<button type="button" class="cp" data-copy="' + esc(text) + '">복사</button>'; }

var list = document.getElementById('list');
var html = '', lastG = '', cnt = {};
ITEMS.forEach(function (it, i) {
  var key = it.trip || '';
  if (key + it.g !== lastG) { html += '<div class="group" data-g="' + it.g + '">' + it.g + '</div>'; lastG = key + it.g; }
  it.no = it.ll ? (cnt[key] = (cnt[key] || 0) + 1) : null;
  if (it.img && it.img.every(function (p) { return /rin24_(?!gyeongbok)/.test(p); })) it.wide = true;  // 영상 캡처는 16:9 그대로
  if (it.img) it.img = it.img.map(function (p) { return p + IMGV; });  // 같은 이름으로 사진을 바꿨을 때 캐시 무시
  html += '<div class="card' + (it.ll || it.img ? ' pin' : '') + '" data-i="' + i + '">' +
    '<div class="no">' + (it.no ? String(it.no).padStart(2, '0') : '–') + '</div><div>' +
    '<p class="t">' + esc(it.t) + (it.sub ? '<i>' + esc(it.sub) + '</i>' : '') + (it.guess ? '<i>추정</i>' : '') +
      (it.addr ? cp(it.copyName || it.t) : '') + '</p>' +
    (it.addr ? '<p class="a">' + esc(it.addr) + cp(it.addr) + '</p>' : '') +
    '<p class="d">' + [it.d, it.who.map(function (w) { return NAMES[w]; }).join(', ')].filter(Boolean).map(esc).join(' · ') + '</p>' +
    (it.e ? '<p class="e">' + esc(it.e) + '</p>' : '') +
    (it.q ? '<p class="q">' + esc(it.q) + '</p>' : '') +
    '<p class="s">' + it.src.map(function (s) { return '<a href="' + s[1] + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a>'; }).join('') + '</p>' +
    (it.img ? '<div class="ph' + (it.wide ? ' wide' : '') + '">' + it.img.map(function (p) { return '<img src="' + p + '" alt="" loading="lazy">'; }).join('') + '</div>' : '') +
    '</div></div>';
});
list.innerHTML = html;
var cards = list.querySelectorAll('.card');

var map = null, markers = {};
function setActive(i, fly) {
  cards.forEach(function (c) { c.classList.toggle('on', +c.dataset.i === i); });
  Object.keys(markers).forEach(function (k) {
    var el = markers[k].getElement();
    if (el) el.firstChild.classList.toggle('on', +k === i);
  });
  if (!map) return;
  if (i < 0 || !markers[i]) { map.closePopup(); return; }
  if (fly) map.flyTo(ITEMS[i].ll, 16, { duration: 0.6 });
  markers[i].openPopup();
}
function popupHtml(it) {
  return '<div class="pp">' + (it.img ? '<img src="' + it.img[0] + '" alt="">' : '') + '<b>' + esc(it.t) + '</b></div>';
}

try {
  var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  map = L.map('map', { zoomControl: true, attributionControl: true, scrollWheelZoom: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  var pts = [];
  ITEMS.forEach(function (it, i) {
    if (!it.ll) return;
    var m = L.marker(it.ll, { icon: L.divIcon({ className: '', html: '<div class="mk">' + it.no + '</div>', iconSize: [22, 22], iconAnchor: [11, 11] }) });
    if (!it.trip) m.addTo(map);
    m.bindPopup(popupHtml(it), { closeButton: false, offset: [0, -8], autoPanPadding: [24, 24] });
    m.on('click', function () {
      setActive(i, false);
      list.querySelector('.card[data-i="' + i + '"]').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    markers[i] = m; if (!it.trip) pts.push(it.ll);
  });
  map.fitBounds(pts, { padding: [40, 40] });
} catch (e) { document.getElementById('map').style.display = 'none'; }

list.addEventListener('click', function (ev) {
  var b = ev.target.closest('.cp');
  if (!b) return;

  var text = b.getAttribute('data-copy');
  var done = function () { b.textContent = '복사됨'; b.classList.add('ok'); setTimeout(function () { b.textContent = '복사'; b.classList.remove('ok'); }, 1200); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, function () { fallback(text); done(); });
  } else { fallback(text); done(); }
}, true);
function fallback(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

var lb = document.getElementById('lb');
function closeLb() { lb.classList.remove('on'); }

document.addEventListener('click', function (ev) {
  var im = ev.target.closest('.ph img, .pp img');
  if (!im) return;
  ev.stopPropagation();
  lb.firstChild.src = im.getAttribute('src');
  lb.classList.add('on');
}, true);

cards.forEach(function (c) {
  c.addEventListener('click', function (ev) {
    if (ev.target.closest('a')) return;
    var i = +c.dataset.i;
    if (!c.classList.contains('pin')) return;
    if (c.classList.contains('on')) { setActive(-1, false); return; }

var state = { who: '', trip: '' }, route = null;
// 동선: 점선 + 구간 가운데 화살표(화면 좌표로 각도 계산, 줌 바뀌면 다시 그림)
function drawRoute(pts) {
  if (route) { map.removeLayer(route); route = null; }
  if (!map || pts.length < 2) return;
  var col = getComputedStyle(document.body).color;
  route = L.layerGroup([L.polyline(pts, { color: col, weight: 2, opacity: 0.7, dashArray: '5 6' })]).addTo(map);
  for (var k = 0; k + 1 < pts.length; k++) {
    var a = map.latLngToLayerPoint(pts[k]), b = map.latLngToLayerPoint(pts[k + 1]);
    var deg = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    var mid = map.layerPointToLatLng(L.point((a.x + b.x) / 2, (a.y + b.y) / 2));
    route.addLayer(L.marker(mid, { interactive: false, keyboard: false, icon: L.divIcon({ className: '',
      html: '<div class="ar" style="transform:rotate(' + deg + 'deg)">&#10148;</div>', iconSize: [20, 20], iconAnchor: [10, 10] }) }));
  }
}
var routePts = [];
function apply(fit) {
  var vis = [];
  cards.forEach(function (c) {
    var it = ITEMS[+c.dataset.i];
    var show = (state.trip ? it.trip === state.trip : !it.trip) && (!state.who || it.who.indexOf(state.who) >= 0);
    c.hidden = !show;
    if (!show && c.classList.contains('on')) setActive(-1, false);
    if (markers[c.dataset.i]) {
      if (show) { markers[c.dataset.i].addTo(map); vis.push(it.ll); } else map.removeLayer(markers[c.dataset.i]);
    }
  });
  list.querySelectorAll('.group').forEach(function (g) {
    var any = false, el = g.nextElementSibling;
    while (el && el.classList.contains('card')) { if (!el.hidden) any = true; el = el.nextElementSibling; }
    g.hidden = !any;
  });
  routePts = state.trip ? vis : [];
  drawRoute(routePts);
  var cap = document.getElementById('cap');
  cap.hidden = !state.trip;
  if (state.trip) cap.textContent = TRIPS[state.trip] + ' · 번호와 화살표는 시간 순서. 위치가 없는 곳은 목록에만.';
  if (map && fit && vis.length) map.fitBounds(vis, { padding: [40, 40], maxZoom: 15 });
}
if (map) map.on('zoomend', function () { drawRoute(routePts); });

document.getElementById('tabs').addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) return;
  state.who = b.dataset.who;
  this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
  apply(true);
});
document.getElementById('trips').addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) return;
  state.trip = state.trip === b.dataset.trip ? '' : b.dataset.trip;
  this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x.dataset.trip === state.trip); });
  apply(true);
});
// 주소 뒤 #rin2410 처럼 붙이면 그 여행을 켠 채로 연다
var h0 = location.hash.slice(1);
if (TRIPS[h0]) {
  state.trip = h0;
  document.querySelectorAll('#trips button').forEach(function (x) { x.classList.toggle('on', x.dataset.trip === h0); });
}
apply(!!TRIPS[h0]);
