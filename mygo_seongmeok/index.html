<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyGO!!!!! 성먹음</title>
<meta name="description" content="원더리벳 2026 내한 기간 MyGO!!!!! 성우들이 한국에서 먹고 간 곳">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #ffffff;
  --fg: #111111;
  --mute: #8a8a8a;
  --line: #ececec;
  --hover: #f6f6f6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111111; --fg: #ededed; --mute: #7d7d7d; --line: #262626; --hover: #191919; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
  font-size: 14px; line-height: 1.6;
  letter-spacing: -0.01em;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }

.app { display: grid; grid-template-columns: 440px 1fr; height: 100vh; }
.side { overflow-y: auto; border-right: 1px solid var(--line); }
#map { height: 100%; background: var(--hover); }

.head { padding: 40px 32px 24px; }
.head h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
.head p { margin: 6px 0 0; color: var(--mute); font-size: 13px; }

.tabs { display: flex; gap: 18px; padding: 0 32px; border-bottom: 1px solid var(--line); }
.tabs button {
  font: inherit; font-size: 13px; color: var(--mute);
  background: none; border: 0; padding: 10px 0; margin-bottom: -1px;
  border-bottom: 1px solid transparent; cursor: pointer;
}
.tabs button.on { color: var(--fg); border-bottom-color: var(--fg); }

.group { padding: 28px 32px 6px; font-size: 12px; color: var(--mute); }

.card {
  display: grid; grid-template-columns: 22px 1fr; gap: 0 12px;
  padding: 16px 32px; cursor: default;
  border-top: 1px solid var(--line);
}
.group + .card { border-top: 0; }
.card.pin { cursor: pointer; }
.card.pin:hover, .card.on { background: var(--hover); }
.card[hidden] { display: none; }
.no { font-size: 12px; color: var(--mute); padding-top: 2px; font-variant-numeric: tabular-nums; }
.card.on .no { color: var(--fg); }
.t { font-size: 15px; font-weight: 600; margin: 0; }
.t i { font-style: normal; font-weight: 400; font-size: 12px; color: var(--mute); margin-left: 6px; }
.d { margin: 2px 0 0; color: var(--mute); font-size: 13px; }
.e { margin: 8px 0 0; }
.q { margin: 6px 0 0; font-size: 13px; color: var(--mute); }
.s { margin: 10px 0 0; font-size: 12px; color: var(--mute); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.s a { text-decoration: none; border-bottom: 1px solid var(--line); }
.s a:hover { color: var(--fg); border-bottom-color: var(--fg); }

.foot { padding: 28px 32px 40px; font-size: 12px; color: var(--mute); border-top: 1px solid var(--line); }
.foot p { margin: 0 0 4px; }

.mk {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--bg); color: var(--fg); border: 1px solid var(--fg);
  font: 600 11px/20px "Pretendard Variable", sans-serif; text-align: center;
  font-variant-numeric: tabular-nums;
}
.mk.on { background: var(--fg); color: var(--bg); }
.leaflet-container { font-family: inherit; }
.leaflet-control-attribution { font-size: 10px; }
.leaflet-bar a { border-radius: 0 !important; }

@media (max-width: 820px) {
  .app { display: flex; flex-direction: column; height: auto; }
  #map { order: -1; position: sticky; top: 0; height: 42vh; flex: none; z-index: 1000; border-bottom: 1px solid var(--line); }
  .side { overflow: visible; border-right: 0; }
  .head { padding: 28px 16px 18px; }
  .tabs, .group, .foot { padding-left: 16px; padding-right: 16px; }
  .card { padding: 14px 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="head">
      <h1>MyGO!!!!! 성먹음</h1>
      <p>원더리벳 2026 · 2026.11.20 – 11.22</p>
    </div>
    <nav class="tabs" id="tabs">
      <button type="button" class="on" data-who="">전체</button>
      <button type="button" data-who="코코">하야시 코코</button>
      <button type="button" data-who="린">타테이시 린</button>
      <button type="button" data-who="히나">아오키 히나</button>
    </nav>
    <div id="list"></div>
    <div class="foot">
      <p>출처는 성우 본인 X, 인스타 스토리 캡처, 방갤 글 순서.</p>
      <p>가게를 사진으로 맞춘 곳은 추정. 마지막 갱신 2026.11.22</p>
    </div>
  </aside>
  <div id="map"></div>
</div>

<script>
var DC = 'https://gall.dcinside.com/mgallery/board/view/?id=bandress&no=';
var COCO_TRIP = 'https://x.com/cocohayashi515/status/2124493155898986601';

var ITEMS = [
  { g: '식당', t: '천지연 일산점', guess: true, d: '고양 일산동구 무궁화로 359 · 11.20 저녁',
    e: '돼지갈비, 물냉면', who: ['코코', '린', '히나'],
    q: '불판·반찬·냉면 고명이 사진과 일치. 체인이라 지점은 공연장 근처로 본 것.',
    ll: [37.67782072, 126.79914158],
    src: [['아오키 히나 스토리', DC + 638496], ['코코 스토리', DC + 639212], ['린 사진', DC + 638368], ['가게 찾은 글', DC + 638398], ['카카오맵', 'https://place.map.kakao.com/837442126']] },
  { g: '식당', t: '능동미나리 성수점', d: '서울 성동구 연무장길 42',
    e: '미나리 요리', who: ['코코'],
    q: '뒷배경과 메뉴 가격까지 일치.',
    ll: [37.54276077, 127.05395304],
    src: [['코코 X', COCO_TRIP], ['방갤 #639457', DC + 639457], ['방갤 #639454', DC + 639454], ['카카오맵', 'https://place.map.kakao.com/134670855']] },
  { g: '식당', t: '이랑닭한마리칼국수', d: '서울 성동구 성수이로7길 7',
    e: '닭한마리 칼국수', who: ['코코'],
    ll: [37.53968003, 127.05443397],
    src: [['코코 X', COCO_TRIP], ['방갤 #639454', DC + 639454], ['카카오맵', 'https://place.map.kakao.com/1425512946']] },
  { g: '식당', t: '스타벅스', sub: '스타필드마켓 일산점', guess: true, d: '고양 일산서구 킨텍스로 171',
    e: '아이스 음료, 케이크', who: ['코코'],
    q: '사진 뒤 파란 천장 장식으로 짐작한 매장.',
    ll: [37.66158296, 126.74406532],
    src: [['코코 X', COCO_TRIP], ['방갤 #639460', DC + 639460]] },
  { g: '간식', t: '호떡, 소떡소떡', d: '원더리벳 케이터링 부스 · 킨텍스 제2전시장 · 11.21',
    e: '붕어빵, 김밥도', who: ['코코'],
    q: '「포장마차처럼 꾸며진 케이터링 부스에서 직접 눈앞에서 구워주셨어요」',
    ll: [37.664472, 126.7418147],
    src: [['코코 스토리', DC + 638895]] },
  { g: '간식', t: '칠성사이다, 참붕어빵', d: '11.21 공연 당일',
    who: ['코코'],
    src: [['코코 X', 'https://x.com/cocohayashi515/status/2123960968250347564'], ['방갤 #638542', DC + 638542]] },
  { g: '간식', t: '바나나맛우유', d: '11.21 아침',
    who: ['린'],
    src: [['린 X', 'https://x.com/ttisrn_0710/status/2123941716873171038'], ['방갤 #638476', DC + 638476]] }
];
var NAMES = { '코코': '하야시 코코', '린': '타테이시 린', '히나': '아오키 히나' };

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

var list = document.getElementById('list');
var html = '', lastG = '', n = 0;
ITEMS.forEach(function (it, i) {
  if (it.g !== lastG) { html += '<div class="group" data-g="' + it.g + '">' + it.g + '</div>'; lastG = it.g; }
  it.no = it.ll ? ++n : null;
  html += '<div class="card' + (it.ll ? ' pin' : '') + '" data-i="' + i + '">' +
    '<div class="no">' + (it.no ? String(it.no).padStart(2, '0') : '–') + '</div><div>' +
    '<p class="t">' + esc(it.t) + (it.sub ? '<i>' + esc(it.sub) + '</i>' : '') + (it.guess ? '<i>추정</i>' : '') + '</p>' +
    '<p class="d">' + esc(it.d) + ' · ' + it.who.map(function (w) { return NAMES[w]; }).join(', ') + '</p>' +
    (it.e ? '<p class="e">' + esc(it.e) + '</p>' : '') +
    (it.q ? '<p class="q">' + esc(it.q) + '</p>' : '') +
    '<p class="s">' + it.src.map(function (s) { return '<a href="' + s[1] + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a>'; }).join('') + '</p>' +
    '</div></div>';
});
list.innerHTML = html;
var cards = list.querySelectorAll('.card');

var map = null, markers = {};
function setActive(i, fly) {
  cards.forEach(function (c) { c.classList.toggle('on', +c.dataset.i === i); });
  Object.keys(markers).forEach(function (k) {
    var el = markers[k].getElement();
    if (el) el.firstChild.classList.toggle('on', +k === i);
  });
  if (fly && map && ITEMS[i].ll) map.flyTo(ITEMS[i].ll, 16, { duration: 0.6 });
}

try {
  var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  map = L.map('map', { zoomControl: true, attributionControl: true, scrollWheelZoom: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  var pts = [];
  ITEMS.forEach(function (it, i) {
    if (!it.ll) return;
    var m = L.marker(it.ll, { icon: L.divIcon({ className: '', html: '<div class="mk">' + it.no + '</div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(map);
    m.on('click', function () {
      setActive(i, false);
      list.querySelector('.card[data-i="' + i + '"]').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    markers[i] = m; pts.push(it.ll);
  });
  map.fitBounds(pts, { padding: [40, 40] });
} catch (e) { document.getElementById('map').style.display = 'none'; }

cards.forEach(function (c) {
  c.addEventListener('click', function (ev) {
    if (ev.target.closest('a')) return;
    var i = +c.dataset.i;
    if (ITEMS[i].ll) setActive(i, true);
  });
});

document.getElementById('tabs').addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) return;
  var w = b.dataset.who;
  this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
  var vis = [];
  cards.forEach(function (c) {
    var it = ITEMS[+c.dataset.i], show = !w || it.who.indexOf(w) >= 0;
    c.hidden = !show;
    if (markers[c.dataset.i]) {
      if (show) { markers[c.dataset.i].addTo(map); vis.push(it.ll); } else map.removeLayer(markers[c.dataset.i]);
    }
  });
  list.querySelectorAll('.group').forEach(function (g) {
    var any = false, el = g.nextElementSibling;
    while (el && el.classList.contains('card')) { if (!el.hidden) any = true; el = el.nextElementSibling; }
    g.hidden = !any;
  });
  if (map && vis.length) map.fitBounds(vis, { padding: [40, 40], maxZoom: 15 });
});
</script>
</body>
</html>
